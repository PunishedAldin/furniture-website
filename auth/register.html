<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>

    <main class="auth-wrap">
    <section class="card" aria-labelledby="register-title">
            <div class="header">
                <div class="logo" aria-hidden="true">Mimics Inc.</div>
                <div class="title">Create your account
                    <h1 id="register-title">Create your account</h1>
                    <p>Start your journey in minutes</p>
                </div>
            </div>

    <form class="form" action="/register" method="post" novalidate>
        <div class="row two">
            <div>
                <label class="label" for="first_name">First Name</label>
                <input class="input" id="first_name" name="first_name" type="text" placeholder="John" autocomplete="given-name" required>
            </div>

            <div>
                <label class="label" for="last_name">Last Name</label>
                <input class="input" id="last_name" name="last_name" type="text" placeholder="Adventurer" autocomplete="family-name" required>
            </div>
        </div>        

        <div>
            <label class="label" for="email">Email</label>
            <input class="input" id="email" name="email" type="email" placeholder="john.adventurer@example.com" autocomplete="email" required>
        </div>

        <div>
            <label class="label" for="password">Password</label>
            <input class="input" id="password" name="password" type="password" placeholder="Enter password" autocomplete="new-password" required>
            <p class="hint xsmall">At least 32 characters 7 unique special characters and no repeating characters</p>
        </div>

        <div>
            <label class="label" for="confirm_password">Confirm Password</label>
            <input class="input" id="confirm_password" name="confirm_password" type="password" placeholder="Re-enter password" autocomplete="new-password" required>
            <p class="hint xsmall">Make sure this matches the password above</p>
            <p class="hint xsmall">You should probably write it down somewhere</p>
        </div>

        <label class="remember">
            <input class="checkbox" type="checkbox" name="terms" required>
            I agree to the <a href="/terms" class="small" style="margin-left:6px;">Terms</a>
        </label>

        <button class="btn" type="submit">Create Account</button>

        <div class="divider"></div>

        <p class="alt">Already have an account? <a href="login.html">Log in</a></p>
    </form>    
    </section>
    </main>
    
</body>
</html>
