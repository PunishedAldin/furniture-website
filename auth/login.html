<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>

    <main class="auth-wrap">
        <section class="card" aria-labelledby="login-title">
            <div class="header">
                <div class="logo" aria-hidden="true">Mimics Inc.</div>
                <div class="title">
                    <h1 id="login-title">You want another one??</h1>
                    <p>If you're sure.</p>
                </div>
            </div>

            <form class="form" action="/login" method="post" novalidate>
                <div>
                    <label class="label" for="email">Email</label>
                    <input class="input" id="email" name="email" type="email" placeholder="john.adventurer@example.com" autocomplete="email" required>
                </div>

                <div>
                    <label class="label" for="password">Password</label>
                    <input class="input" id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
                </div>

                <label class="remember">
                    <input class="checkbox" type="checkbox" name="remember">
                    Remember me...
                </label>

                <button class="btn" type="submit">Log in</button>

                <div class="divider"></div>

                <p class="alt">Don't have an account? <a href="register.html">Create one</a></p>
            </form>
        </section>
    </main>
    
</body>
</html>
